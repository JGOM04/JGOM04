<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-labelledby="t">
  <title id="t">Sobre mí. Soy Joshua, estudiante de Ingeniería de Software en México. Me gusta construir productos completos, del cuestionario al pago, y que funcionen de verdad: con pruebas, con datos reales y resolviendo problemas concretos de la gente.</title>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/></pattern>
    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#A21CFF"/><stop offset="1" stop-color="#E879F9"/></linearGradient>
  </defs>
  <rect width="1280" height="330" rx="20" fill="#0E0B16"/>
  <rect width="1280" height="330" rx="20" fill="url(#grid)"/>
  <rect x="84" y="66" width="6" height="40" rx="3" fill="url(#accent)"/>
  <text x="108" y="98" font-size="34" font-weight="700" fill="#F5F3FF">Sobre mí</text>

  <g class="ln" style="animation-delay:.1s"><text x="108" y="160" font-size="26" fill="#D4D4D8">Soy Joshua, estudiante de Ingeniería de Software en México.</text></g>
  <g class="ln" style="animation-delay:.25s"><text x="108" y="200" font-size="26" fill="#D4D4D8">Me gusta construir productos completos, <tspan fill="#E879F9">del cuestionario al pago</tspan>,</text></g>
  <g class="ln" style="animation-delay:.4s"><text x="108" y="240" font-size="26" fill="#D4D4D8">y que funcionen de verdad: con pruebas, con datos reales</text></g>
  <g class="ln" style="animation-delay:.55s"><text x="108" y="280" font-size="26" fill="#D4D4D8">y resolviendo problemas concretos de la gente.</text></g>
</svg>
